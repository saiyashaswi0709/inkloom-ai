services:
  - type: web
    name: inkloom-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inkloom-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEMOTRON_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: FRONTEND_URL
        sync: false

databases:
  - name: inkloom-db
    databaseName: inkloom_ai
    user: inkloom_user
    plan: free
